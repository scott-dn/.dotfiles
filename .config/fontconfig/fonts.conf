<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <alias>
    <!--
      Workaround:
      https://github.com/zed-industries/zed/issues/42255#issuecomment-3590814083
    -->
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
     </prefer>
  </alias>

  <!--
    FreeType-based renderers (Alacritty, Zed) don't support the COLRv1
    color-emoji format that Fedora ships as the system Noto Color Emoji.
    /usr is read-only (immutable OS) so we can't delete that file; instead
    reject it here and rely on the CBDT bitmap NotoColorEmoji.ttf installed
    in ~/.local/share/fonts, which these renderers can draw.
  -->
  <selectfont>
    <rejectfont>
      <!--
        The read-only system Noto Color Emoji is COLRv1, which FreeType-based
        renderers (Alacritty, Zed) can't draw. Reject it; the CBDT bitmap
        NotoColorEmoji.ttf in ~/.local/share/fonts is used instead.
      -->
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/Noto-COLRv1.ttf</glob>
      <!--
        Symbola (scalable, monochrome, 2015-era) otherwise outranks the CBDT
        bitmap emoji font in the fallback sort, so Alacritty picks it first and
        emoji show monochrome or as tofu for newer glyphs. Reject it so the
        color emoji font becomes the top emoji-capable fallback. Non-emoji
        symbols fall through to Noto Sans Symbols/Symbols2.
      -->
      <pattern>
        <patelt name="family"><string>Symbola</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
